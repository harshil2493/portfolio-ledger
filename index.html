<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Private Portfolio Ledger</title><style>body{margin:0;font:16px system-ui;background:#f5f7f3;color:#173b31}#setup{max-width:700px;margin:10vh auto;padding:30px}iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0}code{overflow-wrap:anywhere}</style></head><body><main id="setup"><h1>Private Portfolio Ledger</h1><p id="status">Checking configuration…</p><p>This portal uses a private Google Sheet and its attached Google Apps Script. It does not contain credentials or financial data.</p></main><script src="config.js"></script><script>
if(window.top!==window.self){document.body.textContent='Open the portfolio portal directly in its own browser tab.';throw Error('Framing is disabled');}
const endpoint=window.PORTFOLIO_CONFIG?.appsScriptUrl||'';if(/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)){const frame=document.createElement('iframe');frame.title='Private portfolio app';frame.src=endpoint;frame.referrerPolicy='no-referrer';frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-downloads allow-popups');document.body.append(frame);window.addEventListener('message',event=>{let url;try{url=new URL(event.origin);}catch{return;}if(url.protocol!=='https:'||!url.hostname.endsWith('.googleusercontent.com')||event.data?.kind!=='portfolio-ready'||typeof event.data.nonce!=='string')return;event.source.postMessage({kind:'portfolio-verified',nonce:event.data.nonce},event.origin);document.querySelector('#setup').hidden=true;});}else{document.querySelector('#status').textContent='Deployment setup is pending. Set the deployed Apps Script /exec URL in config.js after connecting your private Google Sheet.';}
</script></body></html>
